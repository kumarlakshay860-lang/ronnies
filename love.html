<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        font-family: "Trebuchet MS", sans-serif;
        background: linear-gradient(135deg, #ffd6e7, #ffeef6, #ffd1e3);
    }

    /* ---------------- PASSWORD SCREEN ---------------- */

    #lockScreen {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
        background:
            radial-gradient(circle at 20% 20%, #ffffff55, transparent 25%),
            radial-gradient(circle at 80% 70%, #ff9fc455, transparent 30%),
            linear-gradient(135deg, #ffd1e4, #fff0f7);
    }

    .lockBox {
        width: min(90%, 380px);
        padding: 40px 30px;
        text-align: center;
        border-radius: 30px;
        background: rgba(255,255,255,0.55);
        backdrop-filter: blur(15px);
        box-shadow: 0 20px 60px rgba(160, 55, 100, 0.2);
        animation: appear 1s ease;
    }

    .lockHeart {
        font-size: 65px;
        animation: heartbeat 1.4s infinite;
    }

    .lockBox h1 {
        color: #d6336c;
        margin: 10px 0 25px;
        font-size: 28px;
    }

    #password {
        width: 100%;
        padding: 15px;
        border: 2px solid #ff9cbd;
        border-radius: 15px;
        outline: none;
        text-align: center;
        font-size: 22px;
        letter-spacing: 7px;
        background: rgba(255,255,255,0.8);
    }

    #password:focus {
        border-color: #e75480;
        box-shadow: 0 0 15px #ffb6cd;
    }

    button {
        margin-top: 18px;
        padding: 13px 35px;
        border: none;
        border-radius: 30px;
        background: #e75480;
        color: white;
        font-size: 17px;
        cursor: pointer;
        box-shadow: 0 8px 20px #d94f7b55;
        transition: 0.25s;
    }

    button:hover {
        transform: scale(1.08);
        background: #d83d6c;
    }

    .hint {
        margin-top: 20px;
        color: #a94468;
        font-size: 16px;
    }

    #wrong {
        height: 20px;
        margin-top: 10px;
        color: #d6336c;
        font-size: 14px;
    }


    /* ---------------- MAIN SCENE ---------------- */

    #main {
        display: none;
        position: fixed;
        inset: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 20%, #fff 0%, transparent 25%),
            linear-gradient(#ffd7e8, #fff1f7 65%, #ffc6dc);
    }

    .title {
        position: absolute;
        top: 7%;
        width: 100%;
        text-align: center;
        z-index: 20;
        color: #d6336c;
        font-size: clamp(28px, 6vw, 65px);
        line-height: 1.15;
        text-shadow:
            2px 2px white,
            0 0 15px #ff8fb5;
        animation: titleFloat 3s ease-in-out infinite;
    }

    .subtitle {
        position: absolute;
        top: 24%;
        width: 100%;
        text-align: center;
        color: #b72d5d;
        font-size: clamp(15px, 2.5vw, 25px);
        z-index: 20;
    }


    /* ---------------- ANIME GIRL ---------------- */

    .girl {
        position: absolute;
        left: 50%;
        bottom: 8%;
        transform: translateX(-50%);
        width: 230px;
        height: 360px;
        z-index: 10;
        animation: girlFloat 3s ease-in-out infinite;
    }

    /* hair */
    .hair {
        position: absolute;
        width: 175px;
        height: 190px;
        background: #51354f;
        border-radius: 50% 50% 45% 45%;
        left: 28px;
        top: 5px;
    }

    .hair:before,
    .hair:after {
        content: "";
        position: absolute;
        background: #51354f;
        width: 55px;
        height: 140px;
        top: 65px;
        border-radius: 50%;
    }

    .hair:before {
        left: -18px;
        transform: rotate(12deg);
    }

    .hair:after {
        right: -18px;
        transform: rotate(-12deg);
    }

    /* face */
    .face {
        position: absolute;
        width: 125px;
        height: 140px;
        background: #ffe0c7;
        border-radius: 48% 48% 45% 45%;
        left: 52px;
        top: 35px;
        z-index: 2;
    }

    /* hair bangs */
    .bangs {
        position: absolute;
        width: 130px;
        height: 65px;
        background: #51354f;
        top: 30px;
        left: 50px;
        z-index: 5;
        border-radius: 50% 50% 35% 30%;
        clip-path: polygon(
            0 0, 100% 0,
            90% 55%, 75% 35%,
            62% 70%, 48% 35%,
            35% 75%, 20% 35%,
            5% 65%
        );
    }

    .eye {
        position: absolute;
        width: 16px;
        height: 25px;
        background: #443044;
        border-radius: 50%;
        top: 92px;
        z-index: 6;
    }

    .eye.left {
        left: 78px;
    }

    .eye.right {
        left: 135px;
    }

    .eye:after {
        content: "";
        position: absolute;
        width: 6px;
        height: 8px;
        background: white;
        border-radius: 50%;
        left: 3px;
        top: 3px;
    }

    .blush {
        position: absolute;
        width: 25px;
        height: 12px;
        background: #ff9fb6;
        opacity: .55;
        border-radius: 50%;
        top: 120px;
        z-index: 6;
    }

    .blush.left {
        left: 62px;
    }

    .blush.right {
        left: 143px;
    }

    .mouth {
        position: absolute;
        left: 108px;
        top: 125px;
        width: 18px;
        height: 10px;
        border-bottom: 3px solid #b94c67;
        border-radius: 50%;
        z-index: 6;
    }

    /* body */
    .body {
        position: absolute;
        left: 42px;
        top: 170px;
        width: 145px;
        height: 175px;
        background: #ff8fb4;
        border-radius: 60px 60px 25px 25px;
        z-index: 1;
    }

    .collar {
        position: absolute;
        top: 168px;
        left: 82px;
        width: 65px;
        height: 45px;
        background: white;
        clip-path: polygon(0 0, 100% 0, 70% 100%, 50% 65%, 30% 100%);
        z-index: 4;
    }

    .heartDress {
        position: absolute;
        top: 225px;
        left: 102px;
        font-size: 32px;
        z-index: 5;
    }


    /* ---------------- FLOWERS ---------------- */

    .flower {
        position: absolute;
        font-size: 45px;
        z-index: 5;
        animation: flowerFloat 4s ease-in-out infinite;
    }

    .f1 { left: 8%; bottom: 12%; animation-delay: .2s; }
    .f2 { left: 20%; bottom: 20%; animation-delay: 1s; }
    .f3 { right: 12%; bottom: 15%; animation-delay: .5s; }
    .f4 { right: 23%; bottom: 25%; animation-delay: 1.5s; }
    .f5 { left: 5%; top: 35%; animation-delay: .8s; }
    .f6 { right: 6%; top: 38%; animation-delay: 1.8s; }


    /* ---------------- FALLING HEARTS ---------------- */

    .heart {
        position: absolute;
        top: -50px;
        color: #ff5f91;
        font-size: 25px;
        animation: fall linear infinite;
        z-index: 3;
        opacity: .8;
    }

    .h1 { left: 8%; animation-duration: 7s; }
    .h2 { left: 18%; animation-duration: 9s; animation-delay: 2s; }
    .h3 { left: 31%; animation-duration: 6s; animation-delay: 1s; }
    .h4 { left: 67%; animation-duration: 8s; animation-delay: 3s; }
    .h5 { left: 80%; animation-duration: 6.5s; animation-delay: 1.5s; }
    .h6 { left: 92%; animation-duration: 9s; animation-delay: 2.5s; }


    /* ---------------- ANIMATIONS ---------------- */

    @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(30px) scale(.9);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes titleFloat {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    @keyframes girlFloat {
        0%,100% {
            transform: translateX(-50%) translateY(0);
        }
        50% {
            transform: translateX(-50%) translateY(-12px);
        }
    }

    @keyframes flowerFloat {
        0%,100% {
            transform: translateY(0) rotate(-5deg);
        }
        50% {
            transform: translateY(-18px) rotate(5deg);
        }
    }

    @keyframes fall {
        0% {
            transform: translateY(-50px) rotate(0deg);
        }
        100% {
            transform: translateY(110vh) rotate(360deg);
        }
    }

    @keyframes shake {
        0%,100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
    }

    .shake {
        animation: shake .3s;
    }

    /* mobile */
    @media(max-width:600px) {
        .girl {
            transform: translateX(-50%) scale(.78);
            transform-origin: bottom center;
        }

        .title {
            top: 8%;
        }

        .subtitle {
            top: 23%;
        }

        .flower {
            font-size: 35px;
        }
    }
</style>
</head>

<body>

<!-- PASSWORD SCREEN -->

<div id="lockScreen">

    <div class="lockBox">

        <div class="lockHeart">❤️</div>

        <h1>Something is waiting for you...</h1>

        <input
            type="password"
            id="password"
            maxlength="4"
            placeholder="••••"
            inputmode="numeric"
        >

        <br>

        <button onclick="unlock()">Open ❤️</button>

        <div class="hint">
            Hint: ❤️ day
        </div>

        <div id="wrong"></div>

    </div>

</div>


<!-- MAIN ANIMATION -->

<div id="main">

    <div class="title">
        LOVE U ❤️<br>
        LOVE U 💕<br>
        LOVE U 🌸
    </div>

    <div class="subtitle">
        You are my favorite person in the whole world ✨
    </div>


    <!-- Falling hearts -->

    <div class="heart h1">❤️</div>
    <div class="heart h2">💕</div>
    <div class="heart h3">💗</div>
    <div class="heart h4">❤️</div>
    <div class="heart h5">💖</div>
    <div class="heart h6">💕</div>


    <!-- Flowers -->

    <div class="flower f1">🌸</div>
    <div class="flower f2">🌷</div>
    <div class="flower f3">🌸</div>
    <div class="flower f4">🌹</div>
    <div class="flower f5">🌼</div>
    <div class="flower f6">🌸</div>


    <!-- Anime-style girl -->

    <div class="girl">

        <div class="hair"></div>

        <div class="face"></div>

        <div class="bangs"></div>

        <div class="eye left"></div>
        <div class="eye right"></div>

        <div class="blush left"></div>
        <div class="blush right"></div>

        <div class="mouth"></div>

        <div class="body"></div>

        <div class="collar"></div>

        <div class="heartDress">❤️</div>

    </div>

</div>


<script>

function unlock() {

    const input = document.getElementById("password");
    const wrong = document.getElementById("wrong");
    const lock = document.getElementById("lockScreen");

    if (input.value === "0610") {

        lock.style.transition = "1s ease";
        lock.style.opacity = "0";

        setTimeout(() => {

            lock.style.display = "none";

            document.getElementById("main").style.display = "block";

            // little burst of hearts
            createHeartBurst();

        }, 1000);

    } else {

        wrong.innerHTML = "Wrong password... try again ❤️";

        input.classList.remove("shake");

        // restart animation
        void input.offsetWidth;

        input.classList.add("shake");

        input.value = "";

    }
}


/* Enter key also works */

document.getElementById("password").addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
        unlock();
    }

});


/* Heart explosion after unlocking */

function createHeartBurst() {

    for (let i = 0; i < 35; i++) {

        const heart = document.createElement("div");

        heart.innerHTML = ["❤️","💕","💗","💖","🌸"][Math.floor(Math.random()*5)];

        heart.style.position = "fixed";
        heart.style.left = "50%";
        heart.style.top = "50%";
        heart.style.fontSize = (15 + Math.random()*30) + "px";
        heart.style.zIndex = "50";
        heart.style.pointerEvents = "none";

        document.body.appendChild(heart);

        const angle = Math.random() * Math.PI * 2;
        const distance = 150 + Math.random() * 350;

        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        heart.animate(
            [
                {
                    transform: "translate(-50%, -50%) scale(0)",
                    opacity: 1
                },
                {
                    transform:
                        `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(1.2)`,
                    opacity: 0
                }
            ],
            {
                duration: 1800 + Math.random()*1000,
                easing: "cubic-bezier(.2,.8,.3,1)"
            }
        );

        setTimeout(() => heart.remove(), 3000);
    }

}

</script>

</body>
</html>
